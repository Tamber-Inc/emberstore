name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: clang-format
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: brew install clang-format
      - run: git ls-files '*.h' '*.cpp' '*.mm' | xargs clang-format --dry-run --Werror

  test:
    name: build + test (${{ matrix.os }})
    strategy:
      # See every platform's result — FileLock/FileWatcher especially diverge
      # per platform.
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache
    steps:
      - uses: actions/checkout@v4

      # eacp configures its window, GPU and text modules by default, and on
      # Linux those look up these system libraries. Ninja because `-j` with no
      # number makes Make start every compile at once.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libcurl4-openssl-dev \
            libwayland-dev wayland-protocols libwayland-bin libxkbcommon-dev \
            libdecor-0-dev pkg-config \
            libxcb1-dev libxcb-xkb-dev libxkbcommon-x11-dev \
            libxcb-randr0-dev libxcb-xfixes0-dev libxcb-cursor-dev \
            libxcb-icccm4-dev libxcb-xinput-dev libxcb-xtest0-dev \
            libfreetype-dev libharfbuzz-dev libfontconfig-dev
          echo "CMAKE_GENERATOR=Ninja" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: .cpm-cache
          key: cpm-${{ matrix.os }}-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt') }}

      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  asan:
    name: ASan test run
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: .cpm-cache
          key: cpm-asan-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt') }}

      - name: Configure
        run: cmake -B build-asan -S . -DCMAKE_BUILD_TYPE=RelWithDebInfo -DEMBERSTORE_ASAN=ON

      - name: Build
        run: cmake --build build-asan --config RelWithDebInfo -j

      # The perf guard's timing bounds only mean something un-instrumented —
      # ASan makes the whole-file parse ~3x slower and it always trips.
      - name: Test
        run: ctest --test-dir build-asan -C RelWithDebInfo --output-on-failure -E "1M random rows"
